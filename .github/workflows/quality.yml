name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint TypeScript and React
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint HTML
        run: npm run lint:html

      - name: Check types
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm test

      - name: Detect dead code and unused dependencies
        run: npm run deadcode

      - name: Detect circular dependencies
        run: npm run cycles

      - name: Detect duplication
        run: npm run duplicates

      - name: Build production bundle
        run: npm run build
