name: Quality

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and production browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked security tools
        run: python -m pip install --require-hashes -r requirements-quality.txt

      - name: Install verified native scanners
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/ptype-quality-tools"
          mkdir -p "$tool_dir"
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$tool_dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$tool_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          curl --fail --location --silent --show-error https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 --output "$tool_dir/osv-scanner"
          printf '%s  %s\n' 'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108' "$tool_dir/osv-scanner" | sha256sum --check
          chmod +x "$tool_dir/actionlint" "$tool_dir/osv-scanner"
          curl --fail --location --silent --show-error https://github.com/opengrep/opengrep/releases/download/v1.30.0/opengrep-core_linux_x86.tar.gz --output "$tool_dir/opengrep.tar.gz"
          printf '%s  %s\n' '2a8a6c2f87541b9af04a3902eae6e17e5a87865f05b0eaf3955a5ae0e47ad432' "$tool_dir/opengrep.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/opengrep.tar.gz" -C "$tool_dir"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$tool_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

      - name: Install browser
        run: npm exec -- playwright install --with-deps chromium

      - name: Run the same required gates as local
        run: npm run quality

  pages:
    name: Publish verified Pages site
    needs: quality
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      checks: read # The reusable workflow verifies completed required checks.
      pages: write # Only its deployment job publishes the Pages artifact.
      id-token: write # Pages requires OIDC bound to the protected environment.
    uses: ./.github/workflows/pages.yml
